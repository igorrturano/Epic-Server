# WebPanel PacketHook Configuration
#
# Captura o packet 0xD7 com SubCommand 0x00FB enviado pelo cliente
# quando o jogador interage com o painel WebView2 (fechar, clicar, enviar dados).
#
# Layout do packet recebido:
#   [0xD7:1][size:2][serial:4][0x00FB:2][action:1][data_len:2][data:utf8]
#
#   action: 0x00 = fechar painel
#           0x01 = clique em botão (data = id do botão como string)
#           0x02 = dados de formulário (data = json/string)

Packet 0xD7
{
  Length variable
  SubCommandOffset 7
  SubCommandLength 2
}

SubPacket 0xD7
{
  SubCommandID 0x00FB
  ReceiveFunction webPanel:HandleWebPanelEvent
}
