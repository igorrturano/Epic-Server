# GMHab PacketHook Configuration
# PacketHook for handling 0xD7 GMHab Packets
# Note: 0xBF/0x0099 Hotbar Execute is handled by BFCommand package

Packet 0xD7
{
  Length variable
  SubCommandOffset 7
  SubCommandLength 2
}

SubPacket 0xD7
{
  SubCommandID 0x50
  ReceiveFunction gmhab_handler:HandleGMHabRequest
}

SubPacket 0xD7
{
  SubCommandID 0x51
  ReceiveFunction gmhab_handler:HandleGMHabRequest
}
