# NPCRace-to-umbrella-group mapping consumed by npcDataCache.BuildAbilitiesCache.
# Keeps long race lists out of the brain's compiled data segment (the inlined
# array form pushed brain.src past the 64KB limit on 2026-04-18).
#
# NPCRace values match NPCTemplate.NPCRace case-insensitively.
# Add a race -> respawn the NPCs (cache is built once at spawn).

RaceCategory dragon
{
    NPCRace   dragão
    NPCRace   drake
}

RaceCategory demon
