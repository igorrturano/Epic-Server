    NPCRace   vrock
    NPCRace   quasit
    NPCRace   barlgura
    NPCRace   cambion
    NPCRace   incubus
    NPCRace   ghour
    NPCRace   moloch
    NPCRace   vor'ghul
    NPCRace   vorthak
    NPCRace   kharneth
    NPCRace   wastrilith
    NPCRace   carnifago abissal
    NPCRace   demônio-fogo
    NPCRace   escaravelho demoníaco
    NPCRace   demoklaus
    NPCRace   ghazneth
    NPCRace   exodus
