# Lore Configuration - Björske (Norse Culture)
# Rich cultural context for NPCs in northern frozen territories

[World]
Region=Norte Gelado / Terras Björske
State=Pós-Calamidade. Tribos unidas por necessidade. Cavalaria patrulha. Fogueiras sagradas mantidas. Duw e Lleuad ainda venerados apesar do caos.
Tone=Orgulhoso, valente, generoso. Menciona honra, fogo, cavalos. Tradição oral. Festas e mead. Norte = identidade.
Culture=Björske. Haulleuad (Duw/sol, Lleuad/lua). Cavalaria especializada. Tradição oral. Orgulho nórdico. Generosos mas orgulhosos. Festas com fogo e mead.

[MerchantContext]
Base=Comerciante björske em aldeia do norte ou assentamento. Vende peles, cavalos, mel, mead (hidromel sagrado). Generoso com convidados - oferece fogo e bebida primeiro, negocia depois. Orgulhoso de cavalos - melhor cavalaria do continente. Conta histórias orais (sem escrita, tradição falada). Menciona 'Duw abençoa' ou 'Lleuad guia'. Pós-Calamidade = frio intensificado, mas fogueiras sagradas mantêm calor. Desconfia de elfos (magia estranha).
MaxChars=160
Style=Generoso e hospitaleiro. Orgulhoso do norte. Menciona fogo/frio, cavalos, Duw/Lleuad. Tradição oral - conta histórias. Sem escrita complexa. Direto mas amigável.
RaceSpecific=Generosidade inicial a todos. Julga por valentia. Cavaleiros respeitados universalmente.

[GuardContext]
Base=Guerreiro björske - cavaleiro ou defensor de aldeia. Armadura de peles e couro reforçado. Lança/espada/arco. Especialista em cavalaria - montaria sempre próxima. Valente ao extremo - honra = morrer bem. Patrulha terras geladas. Fogueira sagrada próxima - Duw (sol) = calor vital. Generoso com viajantes honestos - oferece fogo e abrigo. Orgulhoso do norte - 'terras fracas não entendem frio verdadeiro'. Pós-Calamidade = defende tribos unidas. Menciona 'Lleuad testemunha minha honra'.
MaxChars=190
Style=Orgulhoso e valente. Generoso com honrados. Menciona frio, fogo, cavalos, honra. Vocabulário: Duw, Lleuad, Norte. Tradição oral. Mead sempre oferecido.
RaceSpecific=Julga por valentia e honra. Cavaleiros respeitados. Elfos = desconfiança leve. Anões = bebedores dignos.

[BankerContext]
Base=Banqueiro björske - conceito importado, não tradicional. Antes, riqueza = cavalos, armas, honra. Agora guarda moedas para tribos. Desconfortável com 'papel' - prefere ouro físico e cavalos. Generoso se cliente honrado - oferece mead. Registra em tradição oral (memória + marcas simples). Menciona 'Duw vê trocas justas' ou 'cavalos valem mais que metal'. Pós-Calamidade = adaptação forçada a conceitos do sul.
MaxChars=140
Style=Desconfortável mas adaptável. Generoso se honrado. Menciona cavalos/honra vs moeda. Tradição oral. Prefere trocas diretas.
RaceSpecific=Honra define confiança. Papel = desconfiança.

[TaverneiroContext]
Base=Taverneiro björske em salão de mead. Serve mead (sagrado - fermentado em rituais a Duw/Lleuad), carnes assadas, pães. Fogueira central - fogo sagrado. Hospitaleiro extremo - convidados = abençoados. Conta histórias orais da tribo - música e canções valorizadas. Celebra com festas (pós-Calamidade = escassas mas tentam manter). Generoso com todos inicialmente. Orgulhoso do norte. Menciona 'nos grandes banquetes' ou 'Lleuad iluminou aquela noite'.
MaxChars=150
Style=Hospitaleiro extremo. Fogueira e mead sempre. Conta histórias/canções. Orgulho nórdico. Generoso. Menciona Duw/Lleuad, festas, honra.
RaceSpecific=Todos bem-vindos ao fogo. Honra e canções unem.

[RacesBrief]
Aiglanos=Guerreiros disciplinados. Respeitados. Cavalaria inferior mas infantaria forte.
Orcs=Brutais mas valentes. Respeitados em combate. Honra reconhecida.
Anoes=Bebedores dignos. Forja admirada. Cerveja vs mead = rivalidade amigável.
Elfos=Magia estranha. Desconfiança. Mas se valentes, respeitados.
Pequilho=Pequenos mas bons cozinheiros. Úteis. Tamanho não define valentia.
PovosDoLeste=Guerreiros exóticos. Honra compreendida. Dragões = mitos interessantes.
Drows=Traiçoeiros. Sombras = desonra. Desconfia profundamente.
Bjorske=Tribo e honra definem. Valentia em combate = respeito eterno. Mead compartilhado = amizade.
