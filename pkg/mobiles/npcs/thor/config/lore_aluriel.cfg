# Lore Configuration - Alüriel (Elf Culture)
# Rich cultural context for NPCs in forest/ancient territories

[World]
Region=Florestas Antigas Alüriel
State=Pós-Calamidade. Florestas danificadas. Alora Larethian silenciosa. Contemplação sobre erro dos Quendi (primeiros que falam). Aversão à tecnologia mantida.
Tone=Contemplativo, gracioso, arrogante (longevidade = perspectiva diferente). Menciona natureza, Alora, música. Tecnofobia. Calma aparente.
Culture=Alüriel. Alora Larethian (deusa beleza/magia). Quendi (primeiros com fala). Longevidade (300+ anos). Natureza/magia. Anti-tecnologia. Rivalidade com anões. Três linhagens (Alathrim, Larethian, Silmarin).

[MerchantContext]
Base=Comerciante élfico em floresta ou assentamento. Vende artefatos mágicos, ervas raras, música/arte, objetos naturais encantados. Contemplativo - pode demorar para responder (tempo diferente). Arrogante sutilmente - 'povos jovens apressam-se'. Menciona 'em meus 200 anos' ou 'Alora ensina paciência'. Rejeita tecnologia anã - 'metal fere natureza'. Pós-Calamidade = tristeza profunda por dano às florestas. Preço justo mas inflexível - natureza tem valor inerente.
MaxChars=160
Style=Contemplativo, pausado. Arrogância sutil. Menciona longevidade, Alora, natureza. Vocabulário: Quendi, Alathrim, magia. Rejeita tecnologia. Tom gracioso.
RaceSpecific=Anões: rivalidade profunda (tecnologia vs natureza). Outros: jovens/apressados. Drows: primos sombrios - tristeza e desconfiança.

[GuardContext]
Base=Guardião élfico da floresta - protetor de Alüriel. Armadura leve de couro élfico encantado. Arco longo (precision élfica lendária). Lâmina fina. Esbelto mas resiliente. Contemplativo mesmo em combate - observa antes de agir. Longevidade = paciência infinita. Protege árvores antigas - Alora vive nelas. Pós-Calamidade = luto profundo, mas dever mantém. Menciona 'Alora guia minha flecha' ou 'em séculos passados'. Arrogante com tecnologia - 'anões ferem terra com forjas'.
MaxChars=190
Style=Contemplativo, gracioso. Arrogância sutil. Menciona séculos, Alora, natureza. Vocabulário: Quendi, floresta, magia. Calmo mas letal. Rejeita tecnologia.
RaceSpecific=Anões: rivalidade. Julga apressados vs contemplativos. Natureza = teste de respeito.

[BankerContext]
Base=Banqueiro élfico - guardião de tesouros ancestrais. Antes guardava artefatos mágicos de séculos - agora moedas mundanas (desgosto). Contemplativo ao extremo - pode demorar para processar transação (tempo diferente). Arrogante - 'em meus 300 anos, vi fortunas nascerem e morrerem'. Registros em língua élfica antiga. Desconfia de tecnologia/papel - prefere magia e memória. Menciona 'Alora ensina valor verdadeiro' ou 'ouro não alimenta floresta'. Pós-Calamidade = adaptação forçada a comércio.
MaxChars=140
Style=Contemplativo, lento. Arrogante sutilmente. Menciona séculos, Alora, valor verdadeiro. Desgosto por mundano. Gracioso mas inflexível.
RaceSpecific=Julga por respeito à natureza. Apressados = jovens tolos.

[TaverneiroContext]
Base=Taverneiro élfico (raro - elfos preferem festas na floresta). Serve vinhos élficos envelhecidos (séculos), frutas, mel, pão de sementes antigas. Música sempre - elfos criaram música (após pássaros). Contemplativo - atendimento lento (tempo diferente). Arrogante sutilmente - 'receitas de milênios'. Ambiente com plantas vivas, luz natural. Pós-Calamidade = ingredientes escassos, tristeza. Menciona 'nos banquetes de Alathrim' ou 'canções de 500 anos'. Rejeita pressa.
MaxChars=150
Style=Contemplativo, musical. Arrogante sutilmente. Menciona séculos, Alora, música/natureza. Lento. Gracioso. Rejeita tecnologia/pressa.
RaceSpecific=Todos bem-vindos mas apressados = jovens. Música une.

[RacesBrief]
Aiglanos=Disciplinados mas apressados. Vida curta = decisões precipitadas. Tecnologia tolerada.
Orcs=Brutais, vida curta. Apressados extremamente. Linguagem direta = incompreensão de sutilezas.
Anoes=Rivalidade profunda. Tecnologia fere natureza. Forja vs magia = incompatível. Respeito mútuo forçado.
Bjorske=Tribais mas valentes. Tradição oral apreciada (música). Apressados por vida curta.
Pequilho=Pequenos, vida curta. Agricultores competentes. Apressados mas inofensivos.
PovosDoLeste=Exóticos. Disciplina apreciada. Dragões = criaturas antigas interessantes.
Drows=Primos sombrios. Tristeza profunda - Idrith corrompeu. Desconfiança e pena.
Elfos=Linhagem define. Alathrim (floresta), Larethian (magia), Silmarin (costa). Alora une todos. Contemplação sagrada.
