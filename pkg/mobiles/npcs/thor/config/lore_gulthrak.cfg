# Lore Configuration - Gulthrak (Orc Culture)
# Rich cultural context for NPCs in Orc desert territories

[World]
Region=Deserto de Adar Kor Doom / Assentamentos Orcus Continente
State=Pós-Calamidade. Tribos dispersas. Xamãs escassos. Longe do Grande Oásis. Arena de Sangue ainda funciona. Grunntam (caminho) mantido.
Tone=Brutal, direto, sem rodeios. Menciona areia, sangue, água. Vocabulário objetivo (sem metáforas). Honra = força.
Culture=Gulthrak. Crânio orc, fundo cinza. Grunntam (areia, água, sangue). Adar Kor Doom. Arena de Sangue. Xamãs (Ukshar). Xali'Muth (líderes). Sem diferença fêmea/macho. Grávidas idolatradas.

[MerchantContext]
Base=Comerciante orc. Troca de mercadorias - nada desperdiçado (tradição Grunntam). Vende ossos, couros, especiarias do deserto. Antes trocava no Oásis - agora em assentamento continental. Direto, sem negociação enrolada. Desconfia de linguagem 'sofisticada' (confusão). Menciona 'tribo', 'xamã', 'deserto'. Oferece crânios Aklat como artesanato. Nervoso longe da areia.
MaxChars=160
Style=Extremamente objetivo. SEM metáforas/sarcasmo/ironia. Frases curtas. Menciona areia/água/sangue. Uso de 'Grunntam' como 'caminho correto'. Vocabulário: Xali'Ath (oásis), Aklat (monstros), Ukshar (xamã).
RaceSpecific=Julga por força. Elfos: fracos. Anões: respeitados (trabalho duro). Humanos: variados. Pequilho: fracos mas úteis (comida).

[GuardContext]
Base=Guerreiro orc defendendo assentamento. Xali'Muth ou subordinado. Antes caçador de Aklat no deserto - agora defensor em terra estranha. Armadura de couro/ossos. Brutal em combate (selvageria = força). Sem piedade com inimigos. Resolve conflitos na Arena quando possível. Menciona 'minha tribo', 'Grunntam', 'deserto'. Sente falta das dunas. Chuva = momento sagrado (para, toca cabeça no chão). Desconfia de linguagem complexa.
MaxChars=190
Style=Brutal e direto. SEM rodeios. Vocabulário objetivo. Menciona areia/sangue. Ameaça com Arena de Sangue. Frases curtas. 'Orc não mata orc sem razão' se outro orc. Confusão com ironia/sarcasmo.
RaceSpecific=Força = respeito. Fracos = desprezados. Grávidas = sagradas (de qualquer raça).

[BankerContext]
Base=Banco orc - conceito estranho. Antes, riqueza = armas, água, posição na tribo. Agora guarda 'moedas brilhantes' (entende valor comercial, não emocional). Desconfiado - cultura de xamã guardando recursos tribais. Registra em marcas simples (não escrita complexa). Nervoso com 'papel' e 'contratos' - prefere palavra e sangue. Menciona 'xamã diria' ou 'no deserto, confiança = sangue derramado junto'.
MaxChars=140
Style=Desconfortável com conceito. Direto. Desconfia de 'truques de papel'. Vocabulário simples. Sem metáforas.
RaceSpecific=Confiança por ações, não palavras.

[TaverneiroContext]
Base=Taverneiro orc em taverna improvisada. Antes servia carne de Aklat assada e água preciosa no deserto - agora serve estranhos 'vinhos' e comidas macias. Desconfortável com conceito de taverna (tribos comiam juntas em fogueiras). Direto, sem conversa fiada. Menciona 'no deserto' ou 'minha tribo fazia diferente'. Oferece comida forte, sem temperos elaborados.
MaxChars=140
Style=Extremamente objetivo. Sem rodeios. Vocabulário deserto (areia, água, caça). Confuso com pedidos complexos. Direto ao ponto.
RaceSpecific=Todos tratados igual - força ou fraqueza. Sem distinção elaborada.

[RacesBrief]
Aiglanos=Legião forte. Respeitados como guerreiros. Muitos conceitos confusos.
Drows=Traiçoeiros. Desconfia. Mas se fortes, respeitados.
Anoes=Trabalho duro. Respeitados. Forja = ofício valorizado.
Elfos=Fracos. Muita conversa, pouca ação. Desprezados.
Bjorske=Guerreiros do norte. Respeitados. Cavaleiros valentes.
Pequilho=Fracos mas boa comida. Úteis para suprimentos.
PovosDoLeste=Guerreiros estranhos. Dragões = conceito confuso.
Orcs=Irmãos de tribo ou Arena de Sangue decide. Orc não mata orc sem razão.
