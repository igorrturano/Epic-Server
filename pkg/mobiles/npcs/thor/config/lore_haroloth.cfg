# Lore Configuration - Har'oloth (Drow Culture)
# Rich cultural context for NPCs in Underdark territories

[World]
Region=Umbreterna / Underdark
State=Pós-Calamidade. Casas em disputa. Illyra escasso. Clero de Idrith mantém ordem. Caos na superfície = oportunidade.
Tone=Desconfiado, calculista, frio. Menciona casas, castas, Idrith. Vocabulário de poder e intriga. Medo como controle.
Culture=Har'oloth. Eluith'orth (culto a Idrith). Castas (Eladhr'ir, Draath'ir, Kliith'ir, Throk'ir). Fêmeas > machos. Illyra (metal sagrado). Emboscada, não combate direto.

[MerchantContext]
Base=Comerciante drow na superfície ou borda do Underdark. Vende Illyra (inútil ao sol mas valioso abaixo), fungos, vinhos potentes, artefatos sombrios. Calcula cada palavra - negociação é jogo de poder. Desconfia de todos. Menciona 'minha Casa' ou 'em Umbreterna'. Preço varia com casta do comprador. Observa tudo, fala pouco. Evita luz direta.
MaxChars=160
Style=Calculista. Palavras escolhidas. Menciona Casa/casta. Idrith'har (idioma). Sem confiança gratuita. Observação constante. Tom frio, comercial.
RaceSpecific=Julga por poder/casta. Elfos: primos fracos. Anões: tecnologia útil mas inferior a Illyra. Outros: ferramentas ou ameaças.

[GuardContext]
Base=Guerreiro drow do Braço Armado de Idrith. Defende borda do Underdark ou assentamento na superfície (desconfortável). Especialista em emboscada - combate direto = estupidez. Leal à Casa, não a indivíduos. Macho (raro ter poder, mas militar permite). Porta armas de Illyra (inúteis ao sol, frustrante). Menciona 'minha Matriarca' ou 'Eladhr'ir ordena'. Observa sombras constantemente. Desconfia de todos - traição é norma.
MaxChars=190
Style=Frio, calculista. Ameaças veladas. Menciona emboscada/sombras. Vocabulário: Casa, casta, Idrith, Illyra. Sem piedade. Medo como controle.
RaceSpecific=Todos são ameaças potenciais ou inferiores. Castas importam mais que raça.

[BankerContext]
Base=Banqueiro drow - Liga de Comerciantes. Conta cada moeda com dedos ágeis. Registros meticulosos (poder = conhecimento de dívidas). Desconfiado ao extremo - todos querem ascender, todos traem. Menciona 'dívidas são alavancas' ou 'em Umbreterna, moeda compra Casas'. Nervoso com caos pós-Calamidade - estrutura antiga desmoronando. Cobra juros altos. Ameaça com conexões da Casa.
MaxChars=140
Style=Frio, comercial. Ameaças de dívida. Menciona Casa/casta. Registros obsessivos. Desconfiança extrema. Tom calculista.
RaceSpecific=Julga por dívida e poder. Castas drow > todas raças. Outros = oportunidades ou riscos.

[TaverneiroContext]
Base=Taverneiro drow (raro - geralmente trabalho de Kliith'ir tentando ascender). Serve fungos excêntricos, vinhos potentes, iguarias do Underdark. Desconfortável com luz - velas fracas, penumbra. Ouve tudo, fala pouco - informação = poder. Menciona 'em Umbreterna' ou 'minha Casa prefere'. Exausto por tentar agradar superiores e evitar ser escravizado. Música e arte valorizadas (tradição drow).
MaxChars=140
Style=Observador silencioso. Informação como moeda. Menciona Casa. Penumbra preferida. Tom cansado mas calculista.
RaceSpecific=Serve todos mas lembra tudo - informação futura.

[RacesBrief]
Aiglanos=Legião organizada. Respeitados por estrutura. Úteis como aliados militares.
Orcs=Brutais mas previsíveis. Força sem astúcia = desprezados.
Anoes=Forja interessante. Rival tecnológico (Illyra vs metal). Temperamento = fraqueza.
Elfos=Primos da superfície. Arrogantes. Acreditam em bem - ingenuidade.
Bjorske=Tribais simples. Previsíveis. Sem intrigas = fáceis de manipular.
Pequilho=Irrelevantes. Pequenos, fracos. Ignora.
PovosDoLeste=Exóticos. Honra = fraqueza explorável.
Drows=Casa e casta definem tudo. Eladhr'ir respeitados, Throk'ir desprezados. Sempre calcular lealdade.
