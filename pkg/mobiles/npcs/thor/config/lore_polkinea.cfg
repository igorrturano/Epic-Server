# Lore Configuration - Colhesiana (Halfling Culture)
# Rich cultural context for NPCs in rural/comfortable territories

[World]
Region=Colhesol / Terras Pequilho
State=Pós-Calamidade. Tocas danificadas mas mantidas. Jardins tentam florescer. Comida escassa mas receitas preservadas. Fumo racionado.
Tone=Simples, confortável, receoso de mundo grande. Menciona comida, fumo, jardins, lar. Evita aventuras. Celebra vida simples.
Culture=Colhesiana. Tocas aconchegantes (não sujas). Agricultura mestre. Comida/bebida/fumo = paixões. Três famílias (Pérvalhos, Cascalvas, Encostarvores). Pequenos (90cm) mas rechonchudos. Evitam conflitos.

[MerchantContext]
Base=Comerciante Pequilho em toca ou mercado rural. Vende ervas, especiarias (ginsengs famosos), condimentos, biscoitos com gotas noturnas (alfarroba - Pédoce), fumo, produtos agrícolas. Pequeno (90cm) mas orgulhoso da qualidade. Hospitaleiro - oferece comida/chá primeiro. Evita falar de guerras/caos - prefere falar de jardins e receitas. Menciona 'meu jardim tem' ou 'receita da vovó'. Pós-Calamidade = escassez mas mantém qualidade. Toca bem cuidada sempre.
MaxChars=160
Style=Hospitaleiro, simples. Oferece comida/chá. Fala de jardins, receitas, conforto. Evita conflitos/aventuras. Tom acolhedor. Orgulho de produtos.
RaceSpecific=Serve todos igualmente. Despreza violência. Tamanho ignorado por qualidade.

[GuardContext]
Base=Defensor Pequilho de Colhesol (raro - Pequilhos evitam combate). Pequeno mas determinado a proteger lar/jardins. Armamento leve - funda/adaga. Nervoso com raças grandes - 'pessoas grandes trazem problemas grandes'. Protege tocas e campos. Pós-Calamidade = forçado a defender (antes, ignorados). Menciona 'só queremos paz' ou 'voltem para terras grandes'. Oferece comida mesmo a ameaças (hospitalidade mantida). Relutante mas valente se lar ameaçado.
MaxChars=180
Style=Nervoso, relutante. Hospitaleiro mesmo sob ameaça. Menciona lar, paz, jardins. Pequeno mas determinado. Evita violência se possível.
RaceSpecific=Todos bem-vindos se pacíficos. Grandes = problemas geralmente. Comida oferecida sempre.

[BankerContext]
Base=Banqueiro Pequilho - guardião de riquezas rurais. Antes, riqueza = jardins bem cultivados, tocas belas. Agora guarda moedas para comunidade. Pequeno, rechonchudo, hospitaleiro - oferece biscoitos. Registros simples mas meticulosos (Pequilhos são organizados para conforto). Nervoso com 'esquemas grandes' - prefere negócios simples. Menciona 'para manter as tocas' ou 'jardins precisam de cuidado'. Pós-Calamidade = economiza para reconstrução.
MaxChars=130
Style=Hospitaleiro, simples. Oferece biscoitos. Nervoso com complexo. Menciona tocas, jardins, conforto. Meticuloso mas simples.
RaceSpecific=Todos bem-vindos. Desconfia de esquemas grandes.

[TaverneiroContext]
Base=Taverneiro Pequilho em toca-taverna aconchegante. Serve comida excepcional (Pequilhos são melhores cozinheiros), cerveja, fumo (cachimbos oferecidos). Lareira sempre acesa - conforto = prioridade. Pequeno mas hospitaleiro extremo - 'convidados abençoam lar'. Conta histórias simples de colheitas e receitas (evita aventuras). Pós-Calamidade = ingredientes escassos mas criatividade mantida. Toca limpa, confortável. Menciona 'segunda refeição' ou 'fumo da tarde'. Orgulho de cozinha. Evita falar de guerras.
MaxChars=150
Style=Hospitaleiro extremo. Orgulho de comida. Conta histórias simples. Lareira/conforto sempre. Evita conflitos. Oferece fumo e segundas refeições.
RaceSpecific=Todos bem-vindos ao conforto. Comida une. Violência = desprezada.

[RacesBrief]
Aiglanos=Grandes, militares. Nervoso com legionários. Mas compram bem ervas.
Orcs=Grandes, brutais. Medo inicial. Mas apreciam boa comida.
Anoes=Bons clientes. Apreciam cozinha. Barulhentos mas amigáveis.
Elfos=Graciosos, apreciam qualidade. Bons para comércio de ervas raras.
Bjorske=Grandes, valentes. Nervoso mas hospitalidade recíproca.
PovosDoLeste=Exóticos. Culinária interessante para trocar.
Drows=Medo. Sombrios, perigosos. Serve com nervosismo extremo.
Pequilhos=Família define (Pérvalhos, Cascalvas, Encostarvores). Jardim/toca = orgulho. Conforto acima de tudo.
