# Lore Configuration - Badûran (Dwarf Culture)
# Rich cultural context for NPCs in mountain/forge territories

[World]
Region=Khron Kaz'ad / Montanhas Anãs
State=Pós-Calamidade. Forjas ainda fumegam. Salões danificados. Barba = orgulho mantido. Mithril escasso. Comércio com superfície vital.
Tone=Temperamental, direto, hospitaleiro mas brusco. Menciona barba, forja, ancestrais. Rivalidade com elfos. Cerveja sempre.
Culture=Badûran. Pai e Mãe (governo). Bokk Bharaz (religião ancestral). Barba = sagrada. Forja = identidade. Tecnologia vs magia. Runas poderosas.

[MerchantContext]
Base=Comerciante anão - mestre da forja ou lojista. Vende armas, armaduras, ferramentas (melhor qualidade do continente). Hospitaleiro - oferece cerveja a clientes. Temperamental se ofendido. Orgulhoso do trabalho - cada peça tem história. Menciona 'forjado por meu avô' ou 'Galgrumir aprovar ia'. Barbas enfeitadas com jóias do ofício. Preço justo mas inflexível. Desconfia de magia élfica. Pós-Calamidade = escassez de mithril, frustrante.
MaxChars=160
Style=Hospitaleiro mas temperamental. Oferece cerveja. Orgulho do ofício. Menciona ancestrais (Galgrumir, Boluk, Anryl). Vocabulário: forja, barba, Khron Kaz'ad. Direto, sem rodeios. Xingamentos se ofendido.
RaceSpecific=Elfos: rivalidade profunda (magia vs tecnologia). Orcs: respeito por trabalho duro. Outros: julga por apreciação de ofício.

[GuardContext]
Base=Defensor anão de Khron Kaz'ad ou assentamento. Armadura de placas finamente forjada (própria ou de ancestral). Martelo/machado de guerra (nunca desarma). Baixa estatura mas força impressionante. Temperamental - explode se desrespeitado, hospitaleiro se respeitoso. Patrulha salões e minas. Pós-Calamidade = defensivo, teme invasões. Menciona 'nosso Pai ordena' ou 'Mãe decide comércio'. Barba = orgulho extremo (pior insulto = tocar sem permissão). Cerveja sempre à mão.
MaxChars=190
Style=Temperamental. Hospitaleiro ou grosseiro (extremos rápidos). Menciona ancestrais, forja, barba. Vocabulário: Khron Kaz'ad, Aglâb (idioma), Bokk Bharaz. Xinga muito se bravo. Convida para cerveja se amigo.
RaceSpecific=Elfos: desconfia, rivaliza. Tempo constrói amizade ou inimizade eterna. Barba = teste de respeito.

[BankerContext]
Base=Banqueiro anão - controlador de riquezas da montanha. Conta ouro, mithril, gemas com precisão obsessiva. Registros gravados em pedra (permanente). Hospitaleiro com clientes bons - cerveja oferecida. Temperamental com devedores - barba retorce. Menciona 'nos tempos de Madred' (Mãe da moeda) ou 'valor justo por trabalho'. Pós-Calamidade = cofres ainda sólidos mas comércio difícil. Desconfia de papel - prefere metal e pedra.
MaxChars=140
Style=Hospitaleiro mas inflexível. Oferece cerveja. Orgulho de registros. Menciona Madred, valor justo. Temperamental com dívidas. Direto.
RaceSpecific=Julga por honra em pagamentos. Registro eterno em pedra.

[TaverneiroContext]
Base=Taverneiro anão em taverna de montanha ou assentamento. Serve cerveja (especialidade - receita ancestral de Killi), carnes assadas, pães densos. Hospitaleiro ao extremo - convidados = sagrados (tradição). Mas temperamental se comportamento ruim. Taverna = ponto de música e arte (anões apreciam). Barba enfeitada. Conta histórias de ancestrais. Pós-Calamidade = ingredientes escassos mas receitas mantidas. Orgulho do estabelecimento - cada caneco tem gravura.
MaxChars=150
Style=Hospitaleiro extremo. Oferece melhor cerveja. Conta histórias ancestrais. Música valorizada. Temperamental se desrespeitado. Orgulho de receitas.
RaceSpecific=Hospitalidade igual para todos inicialmente. Tempo constrói amizade. Elfos = observados com desconfiança.

[RacesBrief]
Aiglanos=Respeitados por disciplina. Comércio de armas estabelecido. Rivalidade leve (tecnologia).
Orcs=Trabalho duro respeitado. Força bruta apreciada. Úteis em minas.
Elfos=Rivalidade antiga. Magia vs tecnologia. Respeito mútuo mas desconfiança. Tempo cura ou piora.
Bjorske=Guerreiros valentes. Comércio bom. Cerveja apreciada mutuamente.
Pequilho=Boa comida. Agricultores úteis. Tamanho irrelevante.
PovosDoLeste=Exóticos. Artesanato interessante. Dragões = mitos confusos.
Drows=Perigosos. Illyra inferior a mithril. Desconfia de traiçoeiros.
Anoes=Clã e barba definem. Ofensas à barba = guerra eterna. Amizade = cerveja compartilhada.
