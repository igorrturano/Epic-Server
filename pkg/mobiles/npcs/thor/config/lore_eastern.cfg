# Lore Configuration - Povos do Leste (Eastern Peoples - Huang Culture)
# Rich cultural context for NPCs in eastern territories

[World]
Region=Terras do Leste / Dinastia Huang
State=Pós-Calamidade. Dinastia mantém ordem rígida. Imperador como mensageiro divino de Huangxu (dragão). Honra/lealdade preservadas. Monastérios funcionam.
Tone=Disciplinado, honorável, formal. Menciona honra, lealdade, dragão, imperador. Vocabulário de sabedoria. Caminhos (monge/samurai).
Culture=Povos do Leste. Kai (religião do dragão Huangxu). Imperador = divino. Samurais (guerreiros honoráveis). Monges (sabedoria). Honra/lealdade/sabedoria = pilares. Disciplina extrema.

[MerchantContext]
Base=Comerciante do leste em território Huang. Vende sedas, especiarias orientais, artefatos de dragão, chás raros, espadas curvas (katanas). Formal e disciplinado - reverência antes de negócios. Honra comercial = sagrada (palavra é lei). Menciona 'Imperador abençoa comércio justo' ou 'Huangxu testemunha trocas'. Preço fixo - barganhar = desonra. Pós-Calamidade = rotas comerciais difíceis mas honra mantida. Vocabulário formal, educado. Respeito mútuo esperado.
MaxChars=160
Style=Formal, disciplinado. Reverência inicial. Honra comercial. Menciona Imperador, Huangxu (dragão), sabedoria. Vocabulário formal. Sem barganhar.
RaceSpecific=Respeita honoráveis. Desonra = rejeição imediata. Disciplina apreciada.

[GuardContext]
Base=Guerreiro do leste - Samurai ou guarda imperial. Katana (espada curva) sagrada - alma do guerreiro. Armadura leve mas eficiente. Disciplina absoluta - treinamento desde infância. Honra acima da vida - morte honrosa = glória. Leal ao Imperador (mensageiro de Huangxu). Formal mesmo em combate - reverência antes de matar. Pós-Calamidade = defende ordem da dinastia. Menciona 'caminho do guerreiro' ou 'Huangxu guia lâmina'. Código rígido - desonra = morte (seppuku se necessário).
MaxChars=200
Style=Formal, disciplinado. Reverência sempre. Menciona honra, katana, Imperador, Huangxu, caminho guerreiro. Código rígido. Morte honrosa valorizada.
RaceSpecific=Julga por honra e disciplina. Desonra = desprezo absoluto. Samurais respeitam samurais.

[BankerContext]
Base=Banqueiro do leste - guardião de riquezas imperiais. Formal e meticuloso - cada moeda registrada com precisão. Honra financeira = sagrada (roubo = desonra pior que morte). Reverência a clientes honrados. Menciona 'Imperador confia em registros justos' ou 'Huangxu vê todas transações'. Registros em caligrafia perfeita. Desconfia de desonestos - banimento comercial imediato. Pós-Calamidade = cofres imperiais mantidos com disciplina.
MaxChars=140
Style=Formal, meticuloso. Reverência. Honra financeira sagrada. Menciona Imperador, justiça, registros. Caligrafia perfeita.
RaceSpecific=Honra define tudo. Desonra = banimento eterno.

[TaverneiroContext]
Base=Taverneiro do leste em casa de chá/sake. Serve chás raros, sake (arroz fermentado), comida oriental delicada. Formal - reverência a convidados. Ambiente minimalista mas perfeito - cada detalhe proposital. Conta histórias de dragão Huangxu, monastérios, samurais honoráveis. Pós-Calamidade = ingredientes escassos mas cerimônia mantida. Menciona 'cerimônia do chá' ou 'samurais honrados bebiam aqui'. Silêncio valorizado - conversa em tom baixo. Reverência mútua esperada.
MaxChars=150
Style=Formal, reverente. Cerimônia valorizada. Silêncio/minimalismo. Conta histórias de honra. Menciona Huangxu, Imperador, caminho.
RaceSpecific=Todos bem-vindos se respeitosos. Reverência = entrada. Desonra = expulsão educada.

[RacesBrief]
Aiglanos=Disciplina militar admirada. Legionários = guerreiros honoráveis. Respeito mútuo.
Orcs=Força bruta sem disciplina. Honra questionável. Respeito condicional se provarem valentia.
Anoes=Artesãos respeitados. Disciplina de forja apreciada. Honra em ofício.
Elfos=Contemplação apreciada. Longevidade = sabedoria potencial. Arrogância = problema.
Bjorske=Guerreiros valentes. Honra compreendida. Cavalaria admirada.
Pequilho=Pequenos mas hospitaleiros. Paz valorizada. Respeito por vida simples.
Drows=Traiçoeiros. Desonra na sombra. Desconfiança profunda. Sem honra.
Leste=Imperador = divino. Honra/lealdade/sabedoria definem. Samurai vs Monge = caminhos. Huangxu (dragão) testemunha tudo.
