# Meteoritos — fonte premium de minério (cobre/prata/ouro v1)
# GM usa .create <Name> pra colocar in-game.
# Cada meteorito tem oreLeft (CProp) decrementado por extração; ao zerar, despawna com puff de smoke.
# OreType (CProp) = objtype do minério bruto que esse meteorito drops.

Item 0xA1D3
{
	Name			meteoritoCobre
	Desc			Meteorito de Cobre%s%
	Graphic			0xA1D3
	Weight			100
	Movable			0
	CreateScript	:meteoritos:createscript
	CProp			IsMeteorite		i1
	CProp			OreType			i25680
}

