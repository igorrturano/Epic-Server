Content <BR>• O Lagar de Vinho é responsável pela produção do Mosto de Vinho através da fabricação do suco de uva.<BR>• Trata-se de um grande barril utilizado para esmagamento de uvas.<BR><BR>• O personagem deve entrar no lagar para pisotear as uvas e produzir o suco necessário para fabricação de vinho.<BR><BR><BASEFONT COLOR=#7A5A1F>> Partes Interativas</BASEFONT><BR>• O lagar possui dois elementos clicáveis:<BR>- O chão central do barril<BR>- As torneiras laterais<BR><BR>• Quando vazio, o chão central possui aparência de piso de madeira.<BR>• Após adicionar uvas, o chão passa a exibir as uvas espalhadas no interior do lagar.<BR><BR><BASEFONT COLOR=#7A5A1F>> Entrando no Lagar</BASEFONT><BR>• Existem duas formas de entrar no lagar:<BR><BR>• Quando vazio:<BR>- É possível entrar pelas laterais próximas às torneiras<BR><BR>• Quando cheio de uvas:<BR>- É possível subir pela escada do lagar e entrar normalmente<BR><BR>• Não é necessário entrar no lagar para adicionar as uvas.<BR>• Do lado externo é possível dar duplo clique no chão central do barril e selecionar as uvas.<BR><BR><BASEFONT COLOR=#7A5A1F>> Processo de Produção</BASEFONT><BR>• Processo de fabricação do suco de uva:<BR>- Adicionar 50 uvas ao lagar pelo chão central<BR>- Pisotear as uvas cerca de 50 vezes<BR>- Retirar o suco utilizando a torneira lateral<BR>- Despejar o conteúdo em um tonel<BR><BR>• O estado atual do mosto ou bebida pode ser consultado diretamente no tonel.<BR><BR><BASEFONT COLOR=#00FFFF>Importante:</BASEFONT><BR>• Veja também o Help “Tonel” para informações sobre fermentação, envelhecimento e produção das bebidas alcoólicas.
