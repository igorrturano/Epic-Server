	Index	tonel barril bebidas alcool alcoolica cerveja vinho hidromel rum licor cidra fermentacao fermentação mosto lagar lagar suco uva envase garrafa copo doses alcoolicas alcoolicos bebida alcoolica  

Content <BR>• O tonel é utilizado para:<BR>- iniciar fermentações para bebidas alcoólicas<BR>- armazenar bebidas<BR>- envelhecer determinados líquidos<BR>- servir bebidas em garrafas e copos<BR><BR>• Cada tonel suporta até 40 doses.<BR><BR>• O tonel possui duas fases principais de manuseio das bebidas alcoólicas:<BR><BR><BASEFONT COLOR=#00FFFF>Menu de Fermentação</BASEFONT><BR>• Responsável pela produção e envelhecimento das bebidas conforme o mosto adicionado.<BR>• Todo mosto possui uma fermentação inicial antes de atingir os estados específicos de cada bebida.<BR><BR>• Nesta fase é possível:<BR>- Interromper Fermentação<BR>- Continuar Fermentando<BR>- Esvaziar o tonel<BR><BR><BASEFONT COLOR=#00FFFF>Menu de Envase</BASEFONT><BR>• Fase final do processo.<BR>• Após interromper a fermentação, é possível armazenar ou servir a bebida em recipientes.<BR><BR>• Nesta fase é possível:<BR>- Encher recipientes<BR>- Adicionar conteúdo<BR>- Esvaziar o tonel<BR><BR>• A opção “Adicionar conteúdo” permite despejar garrafas parcialmente consumidas da mesma bebida no tonel.<BR>• O número de doses restantes é preservado corretamente.<BR>• Não é possível misturar bebidas diferentes no mesmo tonel.<BR><BR><BASEFONT COLOR=#7A5A1F>> Mostos</BASEFONT><BR>• Mostos representam a base da produção alcoólica.<BR>• São o primeiro estágio da fermentação.<BR><BR>• Tipos de mosto existentes:<BR>- Mosto Cervejeiro<BR>- Mosto Adocicado<BR>- Mosto de Vinho<BR><BR>• O Mosto Cervejeiro é utilizado para produção de cerveja jovem, maturada e reserva.<BR>• O Mosto Adocicado é utilizado para produção de licores, hidromel, cidra e rum.<BR>• O Mosto de Vinho é utilizado para produção de vinho.<BR><BR>• A produção dos dois primeiros mostos exige receitas previamente adicionadas ao Livro de Receitas.<BR>• O Mosto de Vinho exige um Lagar de Vinho para produção do suco de uva (See also lagar de Vinho).<BR><BR>• Para iniciar uma fermentação:<BR>- Dê duplo clique no tonel<BR>- Selecione o mosto desejado<BR>- Adicione os ingredientes complementares da bebida<BR>- Aguarde o tempo de fermentação<BR><BR><BASEFONT COLOR=#7A5A1F>> Produção e Tempo das Bebidas</BASEFONT><BR><BASEFONT COLOR=#00FFFF>Cerveja</BASEFONT><BR>• Exige:<BR>- Mosto Cervejeiro<BR>- 1 Levedura<BR>- 5 Águas<BR><BR>• Estados possíveis:<BR>- Cerveja Jovem<BR>- Cerveja Maturada<BR>- Cerveja Reserva<BR><BR>• Tempos aproximados:<BR>- Cerveja Jovem: cerca de 1 hora e meia<BR>- Cerveja Maturada: cerca de 3 horas e meia<BR>- Cerveja Reserva: cerca de 7 horas<BR><BR><BASEFONT COLOR=#00FFFF>Importante:</BASEFONT><BR>• Caso permaneça fermentando além do tempo ideal, a cerveja transforma-se em vinagre.<BR><BR><BASEFONT COLOR=#00FFFF>Licores e Cidra</BASEFONT><BR>• Exigem:<BR>- Levedura<BR>- Ingrediente correspondente<BR><BR>• Receitas:<BR>- 5 Melancias → Licor de Melancia<BR>- 5 Pêssegos → Licor de Pêssego<BR>- 5 Maçãs → Cidra<BR><BR>• Tempo aproximado de fermentação:<BR>- Cerca de 4 horas e meia<BR><BR><BASEFONT COLOR=#00FFFF>Hidromel e Rum</BASEFONT><BR>• Exigem:<BR>- Levedura<BR>- 5 Mel<BR><BR>• Tempos aproximados:<BR>- Hidromel: cerca de 5 horas<BR>- Rum: cerca de 9 horas<BR><BR><BASEFONT COLOR=#00FFFF>Vinho</BASEFONT><BR>• Exige:<BR>- Mosto de Vinho<BR>- Suco de Uva produzido em um Lagar<BR>- Levedura<BR><BR>• Tempo aproximado de fermentação:<BR>- Cerca de 12 horas<BR><BR><BASEFONT COLOR=#00FFFF>Observação:</BASEFONT><BR>• Os tempos de fermentação podem ser reduzidos em até 70% conforme a skill Domestic Work do personagem.<BR><BR><BASEFONT COLOR=#7A5A1F>> Vinho: Safras e Qualidade</BASEFONT><BR>• Os vinhos recebem classificação de safra baseada em:<BR>- Skill de Domestic Work<BR>- Estação do ano<BR>- Fatores aleatórios<BR><BR>• Qualidades possíveis:<BR>- Medíocre<BR>- Discreta<BR>- Boa<BR>- Muito Boa<BR>- Excelente<BR><BR><BASEFONT COLOR=#7A5A1F>> Recipientes e Doses</BASEFONT><BR>• As bebidas podem ser armazenadas em:<BR>- Garrafas<BR>- Copos<BR><BR>• Garrafas armazenam até 4 doses.<BR>• Copos armazenam apenas 1 dose.<BR><BR>• Ao despejar bebidas no tonel, a quantidade de doses restantes é preservada corretamente.
