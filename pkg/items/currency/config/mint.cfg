# Phase 4 — Seignorage / Casa da Moeda
#
# Supply é medido em cobre-equivalente: cobre + 10*prata + 100*ouro,
# somando bag + bank de todos os players (online + offline).
# Atualizado pelo cron diário (coinCensus.src).
#
# mintRate é uniforme nos 3 tiers — economia é um número, não três.
# Walk por brackets: cada unidade marginal paga sua rate marginal.

Settings General
{
	SupplyTarget	15000
	RefuseRatio	3.0
	RefuseMessage	Já temos moedas suficientes em circulação.
}

# Brackets ordenados do mais escasso pro mais inflado.
# Cada bracket cobre o range [previous Upper × target, this Upper × target].
# Acima do último bracket, RefuseRatio aplica.

Bracket Escassa
{
	Order	1
	Upper	0.8
	Rate	0.80
}

Bracket Neutra
{
	Order	2
	Upper	1.2
	Rate	0.60
}

Bracket Abundante
{
	Order	3
	Upper	1.5
	Rate	0.40
}

Bracket Inflada
{
	Order	4
	Upper	2.0
	Rate	0.20
}

Bracket Crise
{
	Order	5
	Upper	3.0
	Rate	0.10
}
