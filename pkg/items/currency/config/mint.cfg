# Phase 4 — Seignorage / Casa da Moeda
#
# Supply é medido em cobre-equivalente: cobre + 10*prata + 100*ouro,
# somando bag + bank de todos os players (online + offline).
# Atualizado pelo cron diário (coinCensus.src).
#
# mintRate é uniforme nos 3 tiers — economia é um número, não três.
# Walk por brackets: cada unidade marginal paga sua rate marginal.

Settings General
{
	SupplyTarget	15000
	RefuseRatio	3.0
	RefuseMessage	Já temos moedas suficientes em circulação.
}

# Brackets ordenados do mais escasso pro mais inflado.
# Cada bracket cobre o range [previous Upper × target, this Upper × target].
# Acima do último bracket, RefuseRatio aplica.

Bracket Escassa
{
	Order	1
	Upper	0.8
	Rate	0.80
}

Bracket Neutra
{
	Order	2
	Upper	1.2
	Rate	0.60
}

Bracket Abundante
{
	Order	3
	Upper	1.5
	Rate	0.40
}

Bracket Inflada
{
	Order	4
	Upper	2.0
	Rate	0.20
}

Bracket Crise
{
	Order	5
	Upper	3.0
	Rate	0.10
}

# Phase 4.5 — Drops bonus de NPC drenados do Cofre (pool counter virtual).
# Mob spawnando rola Chance; se passar, drena dado dado do pool e adiciona
# ao backpack do mob. Sujeito a MinTier (tier do template) e DailyBudget.
# TrueBoss multiplica Chance por TrueBossMultiplier (cprop true_boss=1).

PoolDrop Cobre
{
	Chance				1.0
	DiceRoll			1d6
	MinTier				0
	DailyBudget			100
	TrueBossMultiplier	5.0
}

PoolDrop Prata
{
	Chance				5.0
	DiceRoll			1d3
	MinTier				3
	DailyBudget			10
	TrueBossMultiplier	5.0
}

PoolDrop Ouro
{
	Chance				10.0
	DiceRoll			1d2
	MinTier				5
	DailyBudget			1
	TrueBossMultiplier	5.0
}
