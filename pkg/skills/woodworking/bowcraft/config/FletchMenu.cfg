##########################################################################
# Format for Crafting Menus Config Files:
#
#  Index Entry for Config:
#
#     Craftitem Index      <- This is the Index. Contains the Sub Menu Names
#     {
#      Title	   Example <- HTML Name of the Menu
#      Skill       blacksmithy  <- Skill the menu is for. Same as the ID's in pol
#      SkillID     7       <- SkillID of the skill listed in Skill.
#      Group       Axes    <- Used for each Sub Menu Name
#     }
#
#  Sub Menu Entry for Config:
#
#     Craftitem RingMail   <- Should match the Sub-Menu Group name in Index
#     {
#     	Item	RingmailGloves   <- For each item in the sub-menu. You use the
#                                   objtype name here, not the objtype.
#     }
#
#					ATENÇÃO - QUALQUER ALTERAÇÃO/INCLUSÃO DE GROUPS deve ser adiciondada também na hab de Inventario!!! 
#										Incluir ou deletar recipe não precisa, só groups!
##########################################################################

Craftitem Index
{
	Title   <center>Menu de Arquearia</center>
	Skill   BowcraftFletching
	SkillID BowcraftFletching
	Group	Projeteis
	Group	Armas
}
Craftitem Projeteis
{
	Item	Arrow
	Item	Bolt
}

Craftitem Armas
{
	# Bjorske
	Item	Recipe Bjorska ShortBow
	Item	Recipe Bjorska Arcocurtocomposto
    Item    Recipe Bjorska huntingbow

	# Aluriel
	Item	Recipe Aluriel LongBow
	Item	Recipe Aluriel ArcoLongoComposto
	Item	Recipe Aluriel ArcoCurtoNumaja
	Item	Recipe Aluriel ArcoLongoNumaja

	# Colhesiana
	Item	Recipe Colhesiana Crossbow
	Item	Recipe Colhesiana arcopequilho

	#Baduran
	Item	Recipe Baduran HeavyCrossbow
	Item	Recipe Baduran RepeatingCrossbow

	#Povos do Leste
	Item	Recipe Leste ArcoYumi
    Item    Recipe Leste steppebow

	#Har'oloth
	Item	Recipe Haroloth handcrossbow
	Item	Recipe Haroloth harolothshortbow

	#Gulthrak
	Item	Recipe Gulthrak gulthrakbonebow

	#Aiglana
	Item	Recipe Aiglana aiglanacrossbow
	Item	Recipe Aiglana aiglanabola

}
