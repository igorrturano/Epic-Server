	Index	arrombar gazua gazuas baú
	
Content <BASEFONT COLOR=#7A5A1F>> O que é</BASEFONT><BR>• Capacidade de lidar com dispositivos mecânicos, armadilhas e fechaduras<BR>• Permite desarmar armadilhas e arrombar fechaduras<BR>• Essencial para exploradores, caçadores de tesouros e ladrões<BR><BR><BASEFONT COLOR=#7A5A1F>> Uso da Perícia</BASEFONT><BR>• Pelo menu de skills ou comando ".skill MechanicalAptitude": desarmar armadilhas<BR>• Usando gazuas (lockpicks) com duplo clique: arrombar fechaduras<BR><BR><BASEFONT COLOR=#7A5A1F>> Condições de Uso</BASEFONT><BR>• Mãos livres<BR>• Não estar montado<BR>• Estar próximo ao alvo<BR><BR><BASEFONT COLOR=#7A5A1F>> Desarmar Armadilhas</BASEFONT><BR>• Requer detecção prévia com Awareness<BR>• Pode ser usado em baús, portas e armadilhas de chão ou parede<BR>• Sucesso: armadilha desativada<BR>• Falha: alerta<BR>• Falha crítica: armadilha é acionada<BR>• Armadilhas de baús/portas permanecem desativadas por mais tempo<BR>• Armadilhas ambientais podem se reativar<BR><BR><BASEFONT COLOR=#7A5A1F>> Arrombar Fechaduras</BASEFONT><BR>• Utiliza gazuas (lockpicks)<BR>• Sucesso: fechadura aberta<BR>• Falha crítica: gazua quebrada<BR>• Não funciona em portas de casas de jogadores<BR>• Funciona em baús, containers e portas de dungeon/quest<BR><BR><BASEFONT COLOR=#7A5A1F>> Penalidades</BASEFONT><BR>• Armaduras reduzem eficiência da perícia<BR>• Penalidade maior em luvas e braços<BR>• Quanto mais pesada a armadura, maior a penalidade<BR><BR><BASEFONT COLOR=#7A5A1F><center>SISTEMA AVANÇADO</center></BASEFONT><BR><BASEFONT COLOR=#7A5A1F>> Ativação</BASEFONT><BR>• O sistema avançado é ativado para Mechanical PRI e quando a dificuldade da fechadura está entre +15 e +40 da sua skill<BR>• Nessa faixa é acionado o minigame de lockpicking<BR><BR><BASEFONT COLOR=#7A5A1F>> Fechaduras Avançadas</BASEFONT><BR>• Utilizam minigame com pinos e controle de tensão<BR>• Número de pinos varia conforme dificuldade<BR>• Erros aumentam a tensão<BR>• Falha: fechadura quebrada<BR>• Sucesso: ganho de skill<BR><BR><BASEFONT COLOR=#7A5A1F>> Fechaduras Mágicas</BASEFONT><BR>• Mesmo sistema com uso de mana<BR>• Permite abrir pinos instantaneamente<BR>• Influenciado por Mana ou Magic Lore<BR>• Falha: fechadura quebrada<BR><BR><BASEFONT COLOR=#7A5A1F>> Interação com Armadilhas</BASEFONT><BR>• Alguns baús ativam armadilhas ao serem abertos<BR>• A fechadura pode ser forçada temporariamente para acesso<BR><BR><BASEFONT COLOR=#009999>Dica:</BASEFONT><BR>• Nem toda fechadura quer ser aberta… algumas querem te punir<BR>
}