Content <i><center>Survival não é apenas rastrear, mas compreender o ambiente ao seu redor e utilizá-lo a seu favor</center></i><BR><BASEFONT COLOR=#FDF999>> Rastreamento</BASEFONT><BR>• Ao ativar a perícia é possível escolher entre rastrear:<BR>- Criaturas<BR>- Itens e eventos (corpos, fogueiras, acampamentos, etc)<BR><BR>• O rastreamento permite:<BR>- Identificar a direção do alvo<BR>- Acompanhar seus movimentos<BR>- Seguir rastros continuamente<BR><BR>• Ao rastrear criaturas:<BR>- É possível identificar resistências<BR>- É possível identificar tipos de dano<BR><BR>• O alcance e eficiência do rastreamento variam conforme a skill<BR>• A ação pode falhar<BR>• Não pode ser utilizada em combate<BR><BR><BASEFONT COLOR=#FDF999>> Aproveitamento de Recursos</BASEFONT><BR>• Permite extrair carne, peles e materiais de criaturas<BR>• Qualidade do aproveitamento depende da perícia<BR><BR>• Ferramentas adequadas melhoram o resultado:<BR>- Skinning Knife concede bônus na extração<BR><BR>• Também permite coletar recursos naturais como gravetos<BR>• Peles devem ser curtidas antes do uso em fabricação<BR><BR><BASEFONT COLOR=#FDF999>> Camping</BASEFONT><BR>• Permite montar acampamentos no ambiente<BR>• Acampamentos fornecem recuperação de vida para quem estiver próximo<BR>• Podem ser identificados através do rastreamento<BR><BR><BASEFONT COLOR=#FDF999>> Clima e Sobrevivência</BASEFONT><BR>• Survival reduz os efeitos negativos de condições ambientais adversas<BR>• Atua em situações como:<BR>- Calor extremo<BR>- Frio intenso<BR>- Tempestades e eventos naturais<BR><BR>• Personagens com baixa perícia sofrem mais com o ambiente<BR>• Personagens experientes resistem melhor às condições hostis<BR><BR><BASEFONT COLOR=#FDF999>> Subsistência</BASEFONT><BR>• A perícia auxilia na obtenção de recursos naturais<BR>• Influencia atividades como:<BR>- Pesca<BR>- Uso de redes de pesca<BR>- Coleta em ambientes naturais<BR>
}