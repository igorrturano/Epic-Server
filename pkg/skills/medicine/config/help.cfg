Content <BASEFONT COLOR=#FFD700><B>Adestramento e Cuidados com Pets</B></BASEFONT><BR><BR> <BASEFONT COLOR=#00FF00><B>Primeiros passos</B></BASEFONT><BR> • Para adestrar um animal, leve em conta o pet slot dele (vai de 1 a 5).<BR> • Quanto maior o pet, mais difícil de controlar.<BR> • A quantidade máxima de pets que você pode ter aparece no status do personagem.<BR> • “Informações do Animal” dá acesso a dieta, felicidade, stats e slot.<BR><BR> <BASEFONT COLOR=#00FF00><B>Felicidade (HappyCounter)</B></BASEFONT><BR> • Após domado, o pet passa a ter felicidade (0 a 100).<BR> • Ele perde 1 ponto por minuto enquanto estiver ativo no mundo.<BR> • Para manter a felicidade, alimente corretamente conforme a dieta dele.<BR><BR> <BASEFONT COLOR=#FF5555><B>⚠️ Importante:</B></BASEFONT><BR> • O pet perde felicidade ao:<BR> - Ficar com fome<BR> - Desmaiar (mesmo que ressuscite depois)<BR><BR> • Pets com baixa felicidade:<BR> - Podem ignorar comandos<BR> - Podem abandonar você<BR><BR> <BASEFONT COLOR=#00FFFF><B>Dica importante (Logout)</B></BASEFONT><BR> • Se você deslogar próximo ao pet, ele desloga junto.<BR> • Enquanto estiver deslogado, não perde felicidade.<BR><BR> <BASEFONT COLOR=#00FF00><B>Menu de Trato dos Animais</B></BASEFONT><BR> No gump você verá duas opções importantes:<BR><BR> • <B>Fidelizar?</B><BR> → Define qual pet poderá se tornar fiel (apenas um por vez).<BR><BR> • <B>Cruzar?</B><BR> → Define se o pet pode ser usado para cruzamento (Necessita do item Cajado de Pastoreio).<BR><BR> <BASEFONT COLOR=#FFD700><B>Fidelidade (Pet Fiel)</B></BASEFONT><BR> Se bem cuidado e alimentado por um tempo, o pet se torna fiel.<BR><BR> <B>Benefícios:</B><BR> • Não abandona por fome<BR> • Não ignora comandos<BR> • Ganha DPs (vidas extras)<BR> • Pode ser ressuscitado enquanto o corpo existir<BR><BR> <BASEFONT COLOR=#FF5555><B>Desmaios e Fidelidade (IMPORTANTE)</B></BASEFONT><BR> • Pets fiéis não perdem fidelidade por um único desmaio.<BR><BR> Porém:<BR> • Desmaios reduzem felicidade<BR> • Se acontecer com frequência + má alimentação:<BR> → O pet pode perder a fidelidade<BR><BR> <BASEFONT COLOR=#00FFFF><B>💡 Dica:</B></BASEFONT><BR> Pense como uma “barrinha de confiança”:<BR> Se você vacilar várias vezes, ele deixa de confiar em você.<BR><BR> <BASEFONT COLOR=#00FF00><B>Sistema de DPs (vidas do pet)</B></BASEFONT><BR> • Pet fiel com DP → levanta sozinho após desmaiar<BR> • Sem DP → precisa ser ressuscitado<BR><BR> • Pets não fiéis:<BR> - Não possuem DP<BR> - Podem morrer definitivamente<BR><BR> <BASEFONT COLOR=#FFD700><B>Treinamento (Avançado)</B></BASEFONT><BR> • Com a habilidade Mestre das Feras, você pode acessar o menu de treinamento.<BR> • Lá é possível Despertar Natureza e/ou Instintos do pet.<BR><BR> VEJA+: COMANDOS>Pets
