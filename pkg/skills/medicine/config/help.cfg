Content <BASEFONT COLOR=#FDF999><center>MEDICINA BÁSICA</center></BASEFONT><BASEFONT COLOR=#FDF999>> Bandagens</BASEFONT><BR>• O uso de bandagens é a base da perícia.<BR>• Aplicadas em alvos feridos<BR>• Levam alguns segundos para fazer efeito<BR>• O alvo deve permanecer imóvel durante a cura<BR>• Movimento interrompe o processo<BR><BR>• Após a aplicação:<BR>- Não é possível aplicar novas bandagens até finalizar ou interromper<BR>- Bandagens usadas podem se tornar ensanguentadas<BR>- Podem ser lavadas para reutilização<BR><BR><BASEFONT COLOR=#FDF999>> Fabricação de Bandagens</BASEFONT><BR>• Não requer perícia específica.<BR><BR>• Itens necessários:<BR>- Faca (ou lâmina)<BR>- Tesoura<BR>- Tear<BR>- Roda de fiar<BR><BR>• Processo:<BR>- Obter lã de carneiros<BR>- Transformar em bolas de fio<BR>- Produzir pano no tear<BR>- Cortar em pedaços<BR>- Cortar novamente para gerar bandagens<BR><BR><BASEFONT COLOR=#FDF999>> Examinar</BASEFONT><BR>• Só é possível examinar um alvo se possuir:<BR>- Medicina como perícia primária, ou<BR>- Mais de 61 de skill em Medicine<BR><BR>• Ao examinar, o médico terá acesso a:<BR>- Informações básicas do paciente ou corpo<BR>- Sistema de doenças e sintomas<BR>- Fraturas<BR>- Opção de tratamento<BR>- Autópsia (em corpos)<BR><BR><BASEFONT COLOR=#FDF999>> Restrições</BASEFONT><BR>• É necessário estar próximo ao alvo<BR>• O alvo não pode estar em combate<BR><BR>• A cura depende do estado do alvo:<BR>- Caso esteja em Sangue, requer mais de 40 de Medicine<BR><BR><BASEFONT COLOR=#FDF999>> Estabilização</BASEFONT><BR>• Personagens desmaiados podem ser estabilizados com bandagens<BR>• Consome 5 bandagens<BR>• O alvo acorda rapidamente<BR><BR>• Requisitos:<BR>- Mais de 40 de skill em Medicine para ter chance de sucesso<BR>- Para animais: também requer 40 em Handle Animal<BR><BR>• Animais fiéis possuem DP e levantam após 3 minutos<BR><BR><BASEFONT COLOR=#FDF999>> Bandagens Especiais</BASEFONT><BR>• Disponíveis a partir de Medicine Competente<BR>• Criadas com ervas<BR>• Cada tipo concede efeitos diferentes<BR>• Identificadas por cores distintas<BR><BR><BASEFONT COLOR=#00FFFF>Dica:</BASEFONT><BR>• Cabe ao jogador descobrir suas propriedades<BR><BR><BASEFONT COLOR=#FDF999><center>MEDICINA AVANÇADA</center></BASEFONT><BR><BASEFONT COLOR=#FDF999>> Sintomas</BASEFONT><BR>• Existem 9 sintomas diferentes<BR>• Doenças são formadas por combinações específicas de sintomas<BR><BR><BASEFONT COLOR=#FDF999>> Diagnóstico</BASEFONT><BR>• Realizado com Perícia em Medicina<BR>• Pode falhar<BR>• Requer proximidade e estabilidade do paciente<BR><BR>• Ferramentas auxiliam:<BR>- Estetoscópio: +5 no diagnóstico<BR><BR><BASEFONT COLOR=#FDF999>> Conhecimento Médico</BASEFONT><BR>• Doenças podem ser descobertas<BR>• Personagens armazenam doenças conhecidas<BR><BR>• Ao reconhecer uma doença:<BR>- Nome é revelado<BR>- Informações adicionais ficam disponíveis<BR><BR><BASEFONT COLOR=#FDF999>> Hierarquia de Sintomas</BASEFONT><BR>• Doenças conhecidas possuem:<BR>- Sintoma Primário<BR>- Sintoma Secundário<BR><BR><BASEFONT COLOR=#00FFFF>Importante:</BASEFONT><BR>• Esses sintomas indicam um tratamento mais eficiente<BR><BR>• Ao tratar corretamente:<BR>- A doença pode ser curada sem tratar todos os sintomas<BR><BR>• Tratar fora da ordem:<BR>- Não impede a cura<BR>- Apenas reduz a eficiência<BR><BR><BASEFONT COLOR=#FDF999>> Grau da Doença</BASEFONT><BR>• Leve<BR>• Moderado<BR>• Grave<BR><BR><BASEFONT COLOR=#FDF999>> Tratamento</BASEFONT><BR>• Realizado com a Maleta Médica<BR>• Cada sintoma possui tratamento específico<BR><BR><BASEFONT COLOR=#FDF999>> Autópsia e Laudo</BASEFONT><BR>• Autópsias podem ser realizadas em corpos<BR>• Geram um Laudo Médico<BR>• Podem auxiliar investigações<BR>
