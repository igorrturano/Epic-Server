Content <BASEFONT COLOR=#FDF999><center>ADESTRAMENTO E PETS</center></BASEFONT><BR> <BASEFONT COLOR=#FDF999>> Primeiros passos</BASEFONT><BR> • Para adestrar um animal, leve em conta o pet slot dele (vai de 1 a 5).<BR> • Quanto maior o pet, mais difícil de controlar.<BR> • A quantidade máxima de pets que você pode ter aparece no status do personagem.<BR> • “Informações do Animal” dá acesso a dieta, felicidade, stats e slot.<BR><BR> <BASEFONT COLOR=#FDF999>> Felicidade (HappyCounter)</BASEFONT><BR> • Após domado, o pet passa a ter felicidade (0 a 100).<BR> • Ele perde 1 ponto por minuto enquanto estiver ativo no mundo.<BR> • Para manter a felicidade, alimente corretamente conforme a dieta dele.<BR><BR> <BASEFONT COLOR=#FF5555> Importante:</BASEFONT><BR> • O pet perde felicidade ao:<BR> - Ficar com fome<BR> - Desmaiar (mesmo que ressuscite depois)<BR><BR> • Pets com baixa felicidade:<BR> - Podem ignorar comandos<BR> - Podem abandonar você<BR><BR> <BASEFONT COLOR=#00FFFF>Dica importante (Logout)</BASEFONT><BR> • Se você deslogar próximo ao pet, ele desloga junto.<BR> • Enquanto estiver deslogado, não perde felicidade.<BR><BR> <BASEFONT COLOR=#FDF999>> Menu de Trato dos Animais</BASEFONT><BR> No gump você verá duas opções importantes:<BR><BR> • <B>Fidelizar?</B><BR> → Define qual pet poderá se tornar fiel (apenas um por vez).<BR><BR> • <B>Cruzar?</B><BR> → Define se o pet pode ser usado para cruzamento (Necessita do item Cajado de Pastoreio).<BR><BR> <BASEFONT COLOR=#FDF999>> Fidelidade (Pet Fiel)</BASEFONT><BR> Se bem cuidado e alimentado por um tempo, o pet se torna fiel.<BR><BR> <B>Benefícios:</B><BR> • Não abandona por fome<BR> • Não ignora comandos<BR> • Ganha DPs (vidas extras)<BR> • Pode ser ressuscitado enquanto o corpo existir<BR><BR> <BASEFONT COLOR=#FF5555>Desmaios e Fidelidade (IMPORTANTE)</BASEFONT><BR> • Pets fiéis não perdem fidelidade por um único desmaio.<BR><BR> Porém:<BR> • Desmaios reduzem felicidade<BR> • Se acontecer com frequência + má alimentação:<BR> → O pet pode perder a fidelidade<BR><BR> <BASEFONT COLOR=#00FFFF>Dica:</BASEFONT><BR> Pense como uma “barrinha de confiança”:<BR> Se você vacilar várias vezes, ele deixa de confiar em você.<BR><BR> <BASEFONT COLOR=#FDF999>> Sistema de DPs (vidas do pet)</BASEFONT><BR> • Pet fiel com DP → levanta sozinho após desmaiar<BR> • Sem DP → precisa ser ressuscitado<BR><BR> • Pets não fiéis:<BR> - Não possuem DP<BR> - Podem morrer definitivamente<BR><BR> <BASEFONT COLOR=#FDF999>> Treinamento (Avançado)</BASEFONT><BR> • Com a habilidade Mestre das Feras, você pode acessar o menu de treinamento.<BR> • Lá é possível Despertar Natureza e/ou Instintos do pet.<BR>
