#   #Fator de infalmabilidade do material, quanto maior mais rápido as chamas vão progredir de estado.
#   inflamavel  1
#   
#   #ComponenteEfeito (Formato principal)#
#   
#   ComponenteEfeito <caracteristica> <"t-x" || "n">
#   # caracteristica - em qual caracteristica o efeito atua
#   # "t-x" - valor do efeito desta caracteristica seguindo o formato de tiers.
#   # "n" - valor direto e individual, se mudarmos o valor do tier, este valor se materá intocado.
#   
#   #exemplo:
#   ComponenteEfeito reducaoCritico t-2
#   ou
#   ComponenteEfeito reducaoCritico 1
#   
#   #ComponenteEfeito (Formato secundário)#
#   
#   ComponenteEfeito <caracteristica> [<subCaracteristica> <"t-x" || "n">]... <"t-x" || "n">
#   #Neste caso, existem pares de subcaracteristicas entre a caracteristica e o valor da caractesistica.
#   
#   #exemplo:
#   ComponenteEfeito defesa cortante t-2 perfurante t-2 contusao t-2 t-2
