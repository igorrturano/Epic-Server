#   hpMod 20  
#   
#   #Indica qual o tier esperado daquele material no caso de encaixe vazio.
#   tier 1  
#   
#   #Porcentagem de incremento ou decréscimo de peso do material (nao colocar o % no final)
#   weightMod -10
