#ARQUEIRO

hab Tiro Poderoso
{
    nome Tiro Poderoso
    classe Guerreiro 1
    uso Ativa
    duracao 1 uso
    script :charactercreation:habilidades/tiropoderoso
    desc Voce dispara uma flecha em linha reta que causa dano em todos no caminho dela.
    delay 60
    stam 30
}

hab Tiro Carregado
{
    nome Tiro Carregado
    classe Guerreiro 3
    uso Ativa
    duracao 1 uso
