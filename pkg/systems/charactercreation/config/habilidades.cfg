#CAÇADOR
hab Camuflagem
{
    nome Camuflagem
    classe Guerreiro 1
    uso Ativa
    duracao Tempo
    script :charactercreation:habilidades/camuflagem
    delay 120
    stam 15
    desc Você consegue se esgueirar fora de cidades utilizando o survival. Caso tenha um pet, ele se esgueirará junto, se ele acertar o próximo ataque, será um crítico.
}

hab Caçador Experiente
{
    nome Caçador Experiente
    classe Guerreiro 3
    uso Ativa
    duracao 1 uso
    script :charactercreation:habilidades/instalarrmadilha
    delay 180 
    stam 20
    desc Você é um especialista em sobrevivência. Sabe como fazer redes jogáveis usando cordas e instalar armadilhas de caça. Além disso, é melhor em rastrear e usar sua perícia Survival para proteger um grupo que esteja liderando dos efeitos do clima.
    requisito Camuflagem
}

hab Mestre de Feras
{
    nome Mestre de Feras
    classe Guerreiro 5
    uso Passiva
    desc Você possui a habilidade de despertar a verdadeira natureza do seu animal fiel. Esta habilidade altera a forma natural do animal (força, destreza e vida) e também desperta um instinto selvagem que aumenta o dano crítico do animal de acordo com o tipo de fera.
    requisito Camuflagem
}

hab Espreita Selvagem
{
    nome Espreita Selvagem
    classe Guerreiro 7
    uso Passiva
    desc Adquire +1 slot de animais domesticados e permite ter +1 animal fidelizado. Você e seu pet dobram a quantidade de passos nas sombras
    requisito Camuflagem
}

hab Caçador Implacável
{
    nome Caçador Implacável
    classe Guerreiro 10
    uso Ativa
    desc Sua vida na natureza fortaleceu sua saúde, tornando-o mais resistente ao clima, e também te conferiu habilidades de rastreamento e caça. Você ganha bônus em fortitude e pontos de vida. Além disso, você pode rastrear e caçar implacavelmente sua presa (somente mob), ignorando suas defesas até eliminá-la.
    script :charactercreation:habilidades/marcadacaca
    delay 600
    stam 30
    requisito Camuflagem
}

