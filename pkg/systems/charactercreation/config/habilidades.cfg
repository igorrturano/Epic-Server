#### Clérigo - Igor Turano ####
hab Conexao Divina
{
    nome Conexao Divina
    classe Sabio 1
    uso Ativa
    script :charactercreation:habilidades/cleric/divineconnection
    delay 120
    stam 10
    desc Você se conecta com sua divindade Cada religião oferece uma manifestação única.
}

hab Golpe Radiante
{
    nome Golpe Radiante
    classe Sabio 3
    uso Ativa
    script :charactercreation:habilidades/cleric/radiantsmite
    delay 180
    stam 20
    desc Você canaliza energia divina em um ataque devastador contra seus inimigos. Cada religião manifesta efeitos únicos
    requisito Conexao Divina
}

hab Aura Divina
{
    nome Aura Divina
    classe Sabio 5
    uso Ativa
    script :charactercreation:habilidades/cleric/divineaura
    delay 180
    stam 20
    desc Você se torna imune a doenças e pragas. Se torna mais resistente a venenos e não sente mais medo. Além disso, manifesta uma aura baseada em sua religião.
    requisito Conexao Divina
}

hab Autoridade Divina
{
    nome Autoridade Divina
    classe Sabio 7
    uso Ativa
    duracao Tempo
    script :charactercreation:habilidades/cleric/divineauthority
    delay 300
    stam 40
    desc Você cria terreno consagrado que fortalece aliados e enfraquece inimigos. Cada religião manifesta efeitos únicos.
    requisito Conexao Divina
}

hab Apoteose
{
    nome Apoteose
    classe Sabio 10
    uso Ativa
    duracao Tempo
    script :charactercreation:habilidades/cleric/apoteose
    delay 600
    stam 60
    mana 50
    desc Você ascende à manifestação divina! Suas magias divinas não consomem mana nem possuem delay. Cada religião concede um poder supremo: Veneratio marca inimigos com glória eterna, Bokk Bharaz concede pele de pedra, Halleuad emana luz curativa e destrutiva, Eluith'orth atormenta todos os inimigos, e Kai garante ataques críticos aos aliados.
    requisito Autoridade Divina
}