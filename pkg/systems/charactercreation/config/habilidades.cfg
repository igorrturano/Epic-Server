    nome Irmaos de Areia
    classe Sabio 5
    uso Ativa
    Povo Orc
    script :charactercreation:habilidades/irmaosdeareia
    delay 300
    stam 20
    desc Todos os aliados recebem um critico no proximo golpe, todos os oponentes recebem mais dano por um tempo baseado nas almas coletadas.
    requisito Colheita de Almas
}

hab Ancestralidade Elemental
{
    nome Ancestralidade Elemental
    classe Sabio 7
    uso Ativa
    Povo Orc
    script :charactercreation:habilidades/ancestralidadeelemental
    delay 240
    stam 10
    mana 35
    desc Você consegue invocar uma tempestade que cura todos os aliados na área por um período theology/segundos. Se tiver almas, elas serão raios que dão dano nos inimigos.
    requisito Colheita de Almas
}

hab Arena de Sangue
{
    nome Arena de Sangue
    classe Sabio 10
    uso Ativa
    Povo Orc
    script :charactercreation:habilidades/arenadesangue
    delay 180
    stam 20
    mana 20
    desc Você consegue utilizar as almas coletadas e direcioná-las até o seu oponente, atordoando-o , causando dano de veneno e aterrorizando o oponente, que recebe penalidade na defesa.
    requisito Colheita de Almas
}

