{
    nome Contra-Empunhadura
    classe Guerreiro 1
    uso Ativa
    desc  Sempre que estiver usando uma arma de duas maos e defender um golpe, voce desarma o oponente, que nao pode se rearmar por tactics/5 segundos. Ativamente, adiciona o dobro de forca ao dano por TT/5 segundos.
