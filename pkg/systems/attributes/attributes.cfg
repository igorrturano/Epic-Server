#
# ** PATH-REWORK SKILLS (Phase 1) **
# Renames (Stealth/Theft/Smithing/Carpentry/Perception) live as Alias entries
# on their legacy attributes above — same skill, two names. Splits
# (Tailoring/Provisioning from Domestic_Work, Mining/Lumberjacking from
# Gathering, Taming/Beastmastery from Handle_Animal) need separate
# attributes because each half holds an independent value. The legacy
# attributes (Domestic_Work, Gathering, Handle_Animal) stay until Phase 6
# cleanup, bridged by EffectiveSkill() during the migration window.
#

