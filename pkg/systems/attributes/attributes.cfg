{
	AttributeType	Stat
}

Attribute Dexterity
{
	AttributeType	Stat
}

Attribute Fortitude
{
	AttributeType	Stat
	GetIntrinsicModFunction :attributes:hooks/intrinsicMods:GetIntrinsicFortitude
}

Attribute Reflexes
{
	AttributeType	Stat
	GetIntrinsicModFunction :attributes:hooks/intrinsicMods:GetIntrinsicReflexes
}

Attribute Will
{
	AttributeType	Stat
	GetIntrinsicModFunction :attributes:hooks/intrinsicMods:GetIntrinsicWill
}


