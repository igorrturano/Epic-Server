// CORRIGIDO E MELHORADO
//=====================================================================
// Arquivo de Configuração para o Sistema de Champion Spawn
//
// Formato de um Bloco de Spawn:
// ChampionSpawn <NomeUnicoDoSpawn>
// {
//      Name            "Nome de Exibição do Altar"
//      BossTemplate    TemplateDoChefeFinal
//
//      // Definição das Ondas (Waves)
//      // Formato: Wave<Nivel> Mobs "template1 template2..."
//      //          Wave<Nivel> Amount <QuantidadeTotal>
//      Wave1           Mobs    "goblin goblin2"
//      Wave1           Amount  40
//      Wave2           Mobs    "hobgoblin hobgoblin2"
//      Wave2           Amount  30
//      Wave3           Mobs    "orcbrute orcmage"
//      Wave3           Amount  20
//      Wave4           Mobs    "ettin troll"
//      Wave4           Amount  10
//
//      // Configurações do Evento
//      ActivationCooldown  86400 // Tempo em segundos para reativar após conclusão (24 horas)
//      PlayerCheckRadius   25    // Raio para verificar se há jogadores antes de pausar
// }
//=====================================================================
// ARQUIVO: config/settings.cfg (FORMATO CORRIGIDO E FINAL)
// ARQUIVO: config/settings.cfg (FORMATO CORRETO)

// FORMATO CORRETO E FINAL
ChampionSpawn CavernaDosGoblins
{
    Name                "Caverna dos Goblins"
    BossTemplate        orcbrute_territorial

    Wave1               Mobs        "goblin goblin2"
    Wave1               Amount      30
    Wave2               Mobs        "hobgoblin hobgoblin2"
    Wave2               Amount      1
    Wave3               Mobs        "orcbrute orcbrute"
    Wave3               Amount      1
    Wave4               Mobs        "ettin troll"
    Wave4               Amount      1

    ActivationCooldown  3600
    PlayerCheckRadius   60
}

ChampionSpawn CovilDasAranhas
{
    Name                "Covil das Aranhas"
    BossTemplate        dreadspider_territorial

    Wave1               Mobs        "giantspider dreadspider"
    Wave1               Amount      8
    Wave2               Mobs        "terathanwarrior terathandrone"
    Wave2               Amount      6
    Wave3               Mobs        "terathanavenger terathanmatriarch"
    Wave3               Amount      5
    Wave4               Mobs        "ophidianknight ophidianmage"
    Wave4               Amount      4
    
    ActivationCooldown  7200
    PlayerCheckRadius   60
}

