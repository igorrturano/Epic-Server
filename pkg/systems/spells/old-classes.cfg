}

hab Tormento de Idrith
{
    nome Tormento de Idrith
    classe Sabio 6
    uso Ativa
    script :charactercreation:habilidades/tormentoidrith
    delay 300
    stam 20
    mana 40
    desc Todas as criaturas numa área que não estejam na party são paralisadas por alguns segundos. Se for noite ou caverna, as criaturas ficam cegas, recebendo penalidade no ataque por alguns segundos.
