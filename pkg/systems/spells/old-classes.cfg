###################################

hab Campeao das Montanhas
{
    nome Campeao das Montanhas
    Povo Anao
    classe Sabio 2
    Uso Passiva
    desc O Pai da Forja o abençoa com a Fortitude das Montanhas e a Mãe com a vontade necessária para nunca desistir de seu propósito. + 20 fortitude + 20 vontade
}

hab Martelo Tempestuoso
{
    nome Martelo Tempestuoso
    classe Sabio 3
    uso Ativa
    script :charactercreation:habilidades/martelotempestuoso
    delay 180
    stam 15
    mana 10
    Povo Anao
    desc Você arremessa o seu martelo, que ao atingir o oponente, acerta-o com um raio divino, atordoando-o por alguns segundos baseado no seu mlore.
    requisito Campeao das Montanhas
}

hab Parede de Escudos
{
    nome Parede de Escudos
    classe Sabio 4
    uso Ativa
    script :charactercreation:habilidades/barreiradeescudos
    delay 180
    stam 15
    mana 15
    Povo Anao
    desc Você e seus aliados adjacentes recebem um bônus passivo de parry baseado no seu mlore.
    requisito Campeao das Montanhas
}

hab Salto da Bigorna
{
    nome Salto da Bigorna
    classe Sabio 5
    uso Ativa
    script :charactercreation:habilidades/saltobigorna
    delay 180
    stam 15
    mana 10
    Povo Anao
    desc O anão joga o martelo para cima com uma força divina e se segura nele, saltando 5 tiles. Ao atingir o solo, toda criatura a dois tiles de distância cai com o tremor causado no chão e sofrem dano explosivo. 
    requisito Campeao das Montanhas
}

hab Pele de pedra
{
    nome Pele de pedra
    classe Sabio 6
    uso Ativa
    script :charactercreation:habilidades/pelepedra
    delay 360
    stam 15
    mana 35
    Povo Anao
    desc O clérigo conjura uma pele de pedra que envolve o alvo, tornando-o invulneravel por mlore/10 segundos.
    requisito Campeao das Montanhas
}


#Augur - Domínio da Vida
