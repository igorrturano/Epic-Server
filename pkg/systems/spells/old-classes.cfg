hab Visao verdadeira
{
    nome Visao verdadeira
    Povo Drow
    classe Sabio 2
    uso Ativa
    duracao 1 uso
    script :charactercreation:habilidades/truesight
    delay 60
    mana 10
    desc Caso seja noite ou esteja em cavernas. A clériga consegue revelar qualquer criatura invisível a seu redor, caso revele, a criatura fica paralisada por alguns segundos. Além disso, recebe um bônus passivo em awareness
}

hab Dominancia matriarcal
{
    nome Dominancia matriarcal
    classe Sabio 3
    uso Ativa
    duracao 1 uso
    script :charactercreation:habilidades/dominanciamatriarcal
    delay 180
    mana 15
    stam 10
    desc Caso acerte o próximo golpe com chicote, a clériga causa um dano baseado em seu magiclore. Caso esteja invisível, o dano dobra. Se for noite ou estiver em caverna, o alvo fica paralisado por alguns segundos.
    requisito Visao verdadeira
}

