# Architect Privilege System Configuration
# Epic Server - Sistema de Privilegios de Arquiteto

[Settings]
# Maximum number of architects allowed per faction
MaxArchitectsPerFaction    5

# Minimum staff level that bypasses all architect restrictions
StaffBypassLevel          1

# Enable/disable architect privilege logging (1 = enabled, 0 = disabled)
EnablePrivilegeLogging    1

# Enable/disable architect limit enforcement (1 = enabled, 0 = disabled)
EnforceLimits            1

# Default faction architect privilege for new members (0 = disabled, 1 = enabled)
# Note: This should normally be 0, only set to 1 for testing purposes
DefaultArchitectPrivilege 0

# Require faction membership for architect access (1 = required, 0 = not required)
# Note: Even if set to 0, privilege system still applies to faction members
RequireFactionMembership  1
