# Kingdom System Settings
# All timing values in seconds unless otherwise noted

# Resource Generation
RareResourceInterval        3600      # 1 hour
CommonResourceInterval      7200      # 2 hours
RareResourceBaseAmount      10        # Base amount per generation
CommonResourceBaseAmount    5         # Base amount per generation

# Upkeep System
UpkeepInterval              604800    # 1 week
UpkeepBaseCost              1000      # Base cost in Moedas
UpkeepCostPerTerritory      500       # Additional per territory
UpkeepCostPerBuilding       100       # Additional per building
UpkeepWarningThreshold      3         # Warnings before penalties

# Construction
ConstructionBaseTime        3600      # 1 hour base construction time
ConstructionTimeMultiplier  1.5       # Multiplier per building level

# Guild XP System
XPFromKills                 1.0       # 100% of player XP to guild
XPBlockedOnUpkeepFail       1         # 1=block, 0=allow

# Conquest System
WaveSpawnDelay              30        # Seconds between wave spawns
WaveKillsRequired           5         # Kills to advance (default)
BossAnnouncementRange       20        # Tiles for boss announcement

# Discord Integration
DiscordWebhookEnabled       1
DiscordUpkeepNotifications  1
DiscordConquestNotifications 1
DiscordLevelUpNotifications 1

# Debug
EnableDebugLogging          1