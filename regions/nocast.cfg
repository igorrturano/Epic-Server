# NoCast Regions
#   nocast 1 = spells (recall, gate, teleport, etc) cannot be cast in this region.
#
# Like any other region file, regions only override regions found earlier in the file.

# Prisão da Mina — prisoners must mine their stone quota and hand it to the
# Jailor to be released. Casting is blocked here so they can't Recall out.
Region prisao_mina
{
	Range		4200 2355 4247 2391
	Realm		britannia
	nocast		1
}
